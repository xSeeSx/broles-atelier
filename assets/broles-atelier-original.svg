<title>BROLES ATELIER</title>
<desc>BROLES and ATELIER unchanged. Horizontal arms extended by 15 percent. Both stars use exact cubic Bezier curves with matching first and second derivatives at all eight inner valleys, retaining the small nucleus and tapering to sharp tips. No polygon approximations.</desc>
